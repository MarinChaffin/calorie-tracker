<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0f10;--surface:#16181a;--surface2:#1e2022;
  --border:#2a2d32;--lime:#c8f135;--lime-dim:rgba(200,241,53,0.10);
  --red:#ff5f5f;--red-dim:rgba(255,95,95,0.12);--amber:#ffb347;--amber-dim:rgba(255,179,71,0.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);--purple:#a78bfa;--purple-dim:rgba(167,139,250,0.12);
  --text:#e8e9ec;--muted:#6b7280;--mono:'DM Mono',monospace;--sans:'Inter',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
#root{min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding-bottom:90px;}
.lock-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.lock-icon{font-size:40px;margin-bottom:16px;}
.lock-title{font-size:16px;font-weight:600;margin-bottom:4px;}
.lock-sub{font-size:12px;color:var(--muted);margin-bottom:24px;text-align:center;}
.lock-input{background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:20px;font-family:var(--mono);padding:14px 18px;outline:none;text-align:center;letter-spacing:8px;width:200px;margin-bottom:14px;}
.lock-input:focus{border-color:var(--lime);}
.lock-btn{padding:12px 32px;border-radius:10px;background:var(--lime);color:#111;border:none;font-size:13px;font-weight:600;cursor:pointer;}
.lock-error{color:var(--red);font-size:12px;margin-top:10px;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:20;padding:8px 0 12px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;transition:color 0.15s;}
.nav-btn.active{color:var(--lime);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-size:9px;text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);}
.header{padding:20px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:var(--bg);}
.header-title{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);}
.header-date{font-size:11px;color:var(--muted);font-family:var(--mono);}
.header-switch-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:13px;line-height:1;padding:5px 7px;cursor:pointer;}
.header-switch-btn:hover{color:var(--lime);border-color:var(--lime);}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}
.sync-dot.ok{background:var(--lime);}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;font-family:var(--mono);margin-bottom:14px;}
.section{margin:12px 16px 0;}
.section-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;font-family:var(--mono);margin-bottom:9px;}
.empty-state{text-align:center;padding:28px 0;color:var(--muted);font-size:13px;line-height:1.7;}
.btn-main{width:100%;margin-top:11px;padding:12px;background:var(--lime);color:#111;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-main:disabled{opacity:0.38;cursor:not-allowed;}
.btn-main:not(:disabled):hover{opacity:0.86;}
.btn-secondary{padding:9px 14px;border-radius:8px;background:transparent;color:var(--muted);border:1px solid var(--border);font-size:12px;cursor:pointer;}
.btn-danger{padding:9px 14px;border-radius:8px;background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,95,0.3);font-size:12px;cursor:pointer;}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1;}
.del-btn:hover{color:var(--red);}
.textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:var(--sans);padding:10px 12px;resize:none;outline:none;line-height:1.5;transition:border-color 0.15s;}
.textarea:focus{border-color:var(--lime);}
.textarea::placeholder{color:var(--muted);}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #111;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;}
.spinner-muted{display:inline-block;width:13px;height:13px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;}
.spinner-purple{display:inline-block;width:13px;height:13px;border:2px solid var(--purple);border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--border);margin:12px 0;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;}
.chip.lime{background:var(--lime-dim);color:var(--lime);}
.chip.blue{background:var(--blue-dim);color:var(--blue);}
.chip.purple{background:var(--purple-dim);color:var(--purple);}
.chip.red{background:var(--red-dim);color:var(--red);}
.chip.amber{background:var(--amber-dim);color:var(--amber);}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:12px;color:var(--text);z-index:100;white-space:nowrap;animation:fadeup 0.2s ease;}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.timer-bar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;
  z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.timer-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;font-family:var(--mono);}
.timer-count{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--lime);}
.timer-count.warn{color:var(--amber);}
.timer-count.done{color:var(--red);}
.timer-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:10px;}
.timer-progress-fill{height:100%;border-radius:2px;background:var(--lime);transition:width 1s linear;}
.timer-btns{display:flex;gap:6px;}
.timer-preset{flex:1;padding:7px 0;border-radius:8px;background:var(--surface2);border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-family:var(--mono);cursor:pointer;}
.timer-preset.active{background:var(--lime-dim);border-color:var(--lime);color:var(--lime);}
.timer-stop{padding:7px 14px;border-radius:8px;background:var(--red-dim);border:1px solid rgba(255,95,95,0.3);
  color:var(--red);font-size:11px;cursor:pointer;}
.rest-btn{margin-top:8px;width:100%;padding:8px;border-radius:8px;background:var(--blue-dim);
  border:1px solid rgba(96,165,250,0.3);color:var(--blue);font-size:12px;cursor:pointer;
  font-family:var(--mono);letter-spacing:0.05em;}
.pick-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s;display:flex;justify-content:space-between;align-items:center;}
.pick-card:hover{border-color:var(--lime);}
.pick-name{font-size:14px;font-weight:600;}
.pick-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px;}
.pick-arrow{color:var(--muted);font-size:16px;}
.pick-free{border-style:dashed;justify-content:center;color:var(--muted);}
.pick-free:hover{color:var(--lime);}
.active-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.active-title{font-size:15px;font-weight:600;}
.active-sub{font-size:11px;color:var(--muted);font-family:var(--mono);}
.exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.ex-name{font-size:13px;font-weight:600;flex:1;}
.ex-last{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:10px;}
.sets-table{width:100%;border-collapse:collapse;}
.sets-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);padding:0 0 6px;text-align:left;font-weight:400;}
.sets-table td{padding:5px 0;border-top:1px solid var(--border);font-size:13px;font-family:var(--mono);}
.sets-table td:last-child{text-align:right;}
.set-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:var(--mono);padding:4px 7px;width:60px;outline:none;text-align:center;}
.set-input:focus{border-color:var(--lime);}
.add-set-btn{margin-top:8px;padding:6px 12px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:11px;cursor:pointer;}
.rm-set-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0 4px;}
.add-ex-row{display:flex;gap:8px;margin-top:4px;}
.add-ex-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px;}
.routine-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.routine-name-input{background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;outline:none;flex:1;min-width:0;padding:2px 0;border-bottom:1px solid transparent;}
.routine-name-input:focus{border-bottom-color:var(--lime);}
.ex-chip-list{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
.ex-chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:8px;padding:2px 4px 2px 10px;font-size:12px;}
.ex-chip-input{flex:1;background:transparent;border:none;color:var(--text);font-size:12px;font-family:var(--sans);padding:6px 0;outline:none;border-bottom:1px solid transparent;}
.ex-chip-input:focus{border-bottom-color:var(--lime);}
.session-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;}
.session-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;transition:background 0.15s;}
.session-header:hover{background:var(--surface2);}
.session-date{font-size:13px;font-weight:600;}
.session-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.session-chevron{color:var(--muted);font-size:12px;transition:transform 0.2s;}
.session-chevron.open{transform:rotate(180deg);}
.session-body{padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2);}
.h-ex-row{padding:6px 0;border-bottom:1px solid var(--border);}
.h-ex-row:last-child{border-bottom:none;}
.h-ex-name{font-size:12px;font-weight:500;margin-bottom:2px;}
.h-ex-sets{font-size:11px;color:var(--muted);font-family:var(--mono);}
.chart-wrap{position:relative;height:180px;}
.select-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:var(--sans);padding:10px 12px;outline:none;}
.coach-bubble{background:var(--purple-dim);border:1px solid rgba(167,139,250,0.25);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.coach-tag{font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:0.1em;font-family:var(--mono);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.coach-text{font-size:13px;line-height:1.65;color:var(--text);}
.trend-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:10px;}
.trend-row:last-child{border-bottom:none;}
.trend-name{font-size:12px;flex:1;}
.trend-note{font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var SUPABASE_URL = "https://wsklvtmqynlgmcgimvhl.supabase.co";
var SUPABASE_KEY = "sb_publishable_i5W9iSL75e3QkuEX-F8mJg_ypBpndgS";
var PROFILES = {
  "1905": {id:"main", label:null},
  "2610": {id:"laure", label:"Laure"}
};
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function TODAY(){return new Date().toISOString().split("T")[0];}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});}
function fmtShort(d){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0];}

async function loadData(profileId){
  var res=await supabase.from("tracker_data").select("data").eq("id",profileId).single();
  if(res.error){console.error(res.error);return {};}
  return res.data&&res.data.data?res.data.data:{};
}
async function saveData(profileId,d){
  var res=await supabase.from("tracker_data").upsert({id:profileId,data:d,updated_at:new Date().toISOString()});
  if(res.error){console.error(res.error);throw res.error;}
}
var ANTHROPIC_KEY = "";
async function claudeCall(messages, maxTok){
  if(!ANTHROPIC_KEY){throw new Error("Clé API Claude manquante");}
  maxTok=maxTok||900;
  var r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "x-api-key": ANTHROPIC_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
      "content-type": "application/json"
    },
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:maxTok,messages:messages})
  });
  var d=await r.json();
  if(!r.ok||d.type==="error"){throw new Error((d.error&&d.error.message)||("Erreur API Claude ("+r.status+")"));}
  var blocks=(d&&d.content)||[];
  var textBlock=blocks.filter(function(b){return b.type==="text"&&b.text;}).pop();
  if(!textBlock){throw new Error("Réponse Claude sans texte exploitable");}
  return JSON.parse(textBlock.text.replace(/```json?|```/g,"").trim());
}
async function analyzeBilan(sessions){
  var prompt='Tu es coach de musculation expert en surcharge progressive. Voici mes séances récentes (JSON, kg et reps par série) : '+JSON.stringify(sessions)+
    ' Analyse ma progression exercice par exercice (compare les séances dans le temps : poids, reps, volume). '+
    'Retourne UNIQUEMENT un JSON valide (sans markdown) : {"summary":"2-3 phrases bilan global de la période, en français","per_exercise":[{"name":"nom exercice","trend":"progression|stable|régression","note":"note courte et concrète, ex: +5kg sur la barre en 2 séances"}],"advice":"un conseil concret et actionnable pour la semaine prochaine"}';
  return claudeCall([{role:"user",content:prompt}],1000);
}

function getLastPerformance(sessions,name){
  var n=name.trim().toLowerCase();
  var matches=(sessions||[]).filter(function(s){return s.exercises.some(function(e){return e.name.trim().toLowerCase()===n;});})
    .sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id;});
  if(!matches.length) return null;
  var ex=matches[0].exercises.filter(function(e){return e.name.trim().toLowerCase()===n;}).pop();
  return ex?ex.sets.map(function(s){return {kg:String(s.kg),reps:String(s.reps)};}):null;
}
function defaultSets(sessions,name){
  var last=getLastPerformance(sessions,name);
  if(last&&last.length) return last;
  return [{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}];
}
function allExerciseNames(data){
  var set={};
  (data.routines||[]).forEach(function(r){r.exercises.forEach(function(e){set[e.name]=1;});});
  (data.sessions||[]).forEach(function(s){s.exercises.forEach(function(e){set[e.name]=1;});});
  return Object.keys(set).sort();
}

function ExerciseChart(props){
  var points=props.points;
  var canvasRef=React.useRef();
  var chartRef=React.useRef();
  React.useEffect(function(){
    if(!canvasRef.current||points.length<2) return;
    if(chartRef.current) chartRef.current.destroy();
    var ctx=canvasRef.current.getContext("2d");
    chartRef.current=new Chart(ctx,{
      type:"line",
      data:{labels:points.map(function(p){return p.label;}),datasets:[
        {label:"Charge max",data:points.map(function(p){return p.weight;}),borderColor:"#c8f135",backgroundColor:"rgba(200,241,53,0.08)",borderWidth:2,pointRadius:3,pointBackgroundColor:"#c8f135",tension:0.3,fill:true}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:"#6b7280",font:{size:10}},grid:{display:false}},y:{ticks:{color:"#6b7280",font:{size:10}},grid:{color:"#2a2d32"}}}}
    });
    return function(){if(chartRef.current) chartRef.current.destroy();};
  },[points]);
  if(points.length<2) return <div style={{textAlign:"center",color:"var(--muted)",fontSize:12,padding:"16px 0"}}>Note cet exercice sur au moins 2 séances pour voir la progression 📈</div>;
  return <div className="chart-wrap"><canvas ref={canvasRef}/></div>;
}

function LockScreen(props){
  var _c=React.useState(""); var code=_c[0],setCode=_c[1];
  var _e=React.useState(false); var err=_e[0],setErr=_e[1];
  function submit(){
    var profile=PROFILES[code];
    if(profile){
      sessionStorage.setItem("tracker_unlocked","1");
      sessionStorage.setItem("tracker_profile",JSON.stringify(profile));
      props.onUnlock(profile);
    }
    else{setErr(true);setCode("");setTimeout(function(){setErr(false);},1500);}
  }
  return(
    <div className="lock-screen">
      <div className="lock-icon">🔒</div>
      <div className="lock-title">Séances Tracker</div>
      <div className="lock-sub">Entre ton code d'accès</div>
      <input className="lock-input" type="password" inputMode="numeric" maxLength="4"
        value={code} onChange={function(e){setCode(e.target.value.replace(/\D/g,""));}}
        onKeyDown={function(e){if(e.key==="Enter") submit();}} autoFocus/>
      <button className="lock-btn" onClick={submit}>Déverrouiller</button>
      {err&&<div className="lock-error">Code incorrect</div>}
    </div>
  );
}

function ExerciseChipEditable(props){
  var ex=props.exercise;
  var _n=React.useState(ex.name); var name=_n[0],setName=_n[1];
  React.useEffect(function(){setName(ex.name);},[ex.name]);
  function commit(){
    if(name.trim()&&name.trim()!==ex.name) props.onRename(name.trim());
    else setName(ex.name);
  }
  return(
    <div className="ex-chip">
      <input className="ex-chip-input" value={name} list="exercise-names-list"
        onChange={function(e){setName(e.target.value);}} onBlur={commit}
        onKeyDown={function(e){if(e.key==="Enter") e.target.blur();}}/>
      <button className="del-btn" onClick={props.onRemove}>✕</button>
    </div>
  );
}

function RoutineCard(props){
  var routine=props.routine;
  var _n=React.useState(routine.name); var name=_n[0],setName=_n[1];
  var _cp=React.useState(false); var copying=_cp[0],setCopying=_cp[1];
  function commitName(){
    if(name.trim()&&name.trim()!==routine.name) props.onRename(routine.id,name.trim());
    else setName(routine.name);
  }
  async function copy(){
    setCopying(true);
    await props.onCopyOther(routine);
    setCopying(false);

  return(

        <input className="textarea" style={{padding:"8px 12px",height:"auto"}} placeholder="Ajouter un exercice…" id={"routine-add-"+routine.id}

          onKeyDown={function(e){if(e.key==="Enter"){props.onAddExercise(routine.id,e.target.value);e.target.value="";}}}/>
        <button className="btn-secondary" onClick={function(){
          var input=document.getElementById("routine-add-"+routine.id);
          props.onAddExercise(routine.id,input.value);input.value="";
        }}>+ Ajouter</button>
      </div>
    </div>
  );
}

function App(){
  var _u=React.useState(function(){return sessionStorage.getItem("tracker_unlocked")==="1";}); var unlocked=_u[0],setUnlocked=_u[1];
  var _profile=React.useState(function(){
    try{return JSON.parse(sessionStorage.getItem("tracker_profile")||"null");}catch(e){return null;}
  }); var profile=_profile[0],setProfile=_profile[1];
  var draftKey="wt_draft_v1_"+(profile?profile.id:"main");
  var _tab=React.useState("session"); var tab=_tab[0],setTab=_tab[1];
  var _data=React.useState({}); var data=_data[0],setData=_data[1];
  var _loaded=React.useState(false); var loaded=_loaded[0],setLoaded=_loaded[1];
  var _sync=React.useState("ok"); var syncState=_sync[0],setSyncState=_sync[1];
  var _toast=React.useState(null); var toast=_toast[0],setToast=_toast[1];
  var _active=React.useState(null); var activeSession=_active[0],setActiveSession=_active[1];
  var _newRoutine=React.useState(""); var newRoutineName=_newRoutine[0],setNewRoutineName=_newRoutine[1];
  var _newEx=React.useState(""); var newExName=_newEx[0],setNewExName=_newEx[1];
  var _newExAdd=React.useState(true); var newExAddToRoutine=_newExAdd[0],setNewExAddToRoutine=_newExAdd[1];
  var _histEx=React.useState(""); var histExercise=_histEx[0],setHistExercise=_histEx[1];
  var _gen=React.useState(false); var generatingBilan=_gen[0],setGeneratingBilan=_gen[1];
  var _timerState=React.useState(null); var timerState=_timerState[0],setTimerState=_timerState[1];
  var timerRef=React.useRef(null);

  function startTimer(seconds){
    if(timerRef.current) clearInterval(timerRef.current);
    var end=Date.now()+seconds*1000;
    setTimerState({total:seconds,remaining:seconds,running:true});
    timerRef.current=setInterval(function(){
      var rem=Math.ceil((end-Date.now())/1000);
      if(rem<=0){
        clearInterval(timerRef.current);
        setTimerState(function(t){return Object.assign({},t,{remaining:0,running:false});});
        if(navigator.vibrate) navigator.vibrate([300,100,300]);
        try{
          var ctx=new (window.AudioContext||window.webkitAudioContext)();
          var osc=ctx.createOscillator();var gain=ctx.createGain();
          osc.connect(gain);gain.connect(ctx.destination);
          osc.frequency.value=880;gain.gain.value=0.3;osc.start();osc.stop(ctx.currentTime+0.3);
          setTimeout(function(){
            var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
            o.frequency.value=1100;g.gain.value=0.3;o.start();o.stop(ctx.currentTime+0.4);
          },400);
        }catch(e){}
      } else {
        setTimerState(function(t){return Object.assign({},t,{remaining:rem});});
      }
    },250);
  }
  function stopTimer(){if(timerRef.current) clearInterval(timerRef.current);setTimerState(null);}
  React.useEffect(function(){return function(){if(timerRef.current) clearInterval(timerRef.current);};},[]);

  React.useEffect(function(){
    if(!unlocked||!profile) return;
    loadData(profile.id).then(function(d){
      setData(d);
      if(d._apikey){ANTHROPIC_KEY=d._apikey;}
      setLoaded(true);
      try{
        var draft=localStorage.getItem(draftKey);
        if(draft) setActiveSession(JSON.parse(draft));
      }catch(e){}
    });
  },[unlocked,profile]);

  React.useEffect(function(){
    if(!unlocked||!profile) return;
    var ch=supabase.channel("tc-"+profile.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"tracker_data",filter:"id=eq."+profile.id},function(p){if(p.new&&p.new.data) setData(p.new.data);}).subscribe();
    return function(){supabase.removeChannel(ch);};
  },[unlocked,profile]);

  React.useEffect(function(){
    if(activeSession) localStorage.setItem(draftKey,JSON.stringify(activeSession));
    else localStorage.removeItem(draftKey);
  },[activeSession,draftKey]);

  function showToast(msg){setToast(msg);setTimeout(function(){setToast(null);},2800);}

    setActiveSession({routineId:routine.id,routineName:routine.name,date:TODAY(),exercises:exercises,notes:"",startedAt:Date.now()});
    setTab("session");
  }
  function startFreeSession(){

  function cancelSession(){

    setActiveSession(function(s){return Object.assign({},s,{exercises:s.exercises.map(function(e){
      return e.id!==exId?e:Object.assign({},e,{sets:e.sets.map(function(st,i){return i!==idx?st:Object.assign({},st,{[field]:val});})});
    })});});
  }
  function addSetTo(exId){
    setActiveSession(function(s){return Object.assign({},s,{exercises:s.exercises.map(function(e){
      if(e.id!==exId) return e;
      var last=e.sets[e.sets.length-1];
      return Object.assign({},e,{sets:e.sets.concat([last?Object.assign({},last):{kg:"",reps:""}])});
    })});});
  }
  function removeSetFrom(exId,idx){
    setActiveSession(function(s){return Object.assign({},s,{exercises:s.exercises.map(function(e){
      if(e.id!==exId||e.sets.length<=1) return e;
      return Object.assign({},e,{sets:e.sets.filter(function(_,i){return i!==idx;})});
    })});});
  }
  function removeExerciseFromActive(exId){
    setActiveSession(function(s){return Object.assign({},s,{exercises:s.exercises.filter(function(e){return e.id!==exId;})});});
  }

    var valid=activeSession.exercises.filter(function(e){return e.name.trim()&&e.sets.some(function(s){return s.kg!==""&&s.reps!=="";});});
    if(!valid.length){showToast("⚠️ Ajoute au moins un exercice avec un poids et des reps");return;}
    var durationMin=Math.max(1,Math.round((Date.now()-activeSession.startedAt)/60000));
    var record={
      id:uid(),date:activeSession.date,routineId:activeSession.routineId,routineName:activeSession.routineName,
      notes:activeSession.notes,durationMin:durationMin,
      exercises:valid.map(function(e){return {id:e.id,name:e.name.trim(),sets:e.sets.filter(function(s){return s.kg!==""&&s.reps!=="";}).map(function(s){return {kg:+s.kg,reps:+s.reps};})};})
    };

  }

    await persist(Object.assign({},data,{routines:routines.map(function(r){return r.id!==id?r:Object.assign({},r,{name:name});})}));
  }
  async function addExerciseToRoutine(routineId,name){
    name=(name||"").trim();

      return r.id!==routineId?r:Object.assign({},r,{exercises:r.exercises.concat([{id:uid(),name:name}])});
    })}));

  async function removeExerciseFromRoutine(routineId,exId){

    setProfile(null);
    setUnlocked(false);

  async function deleteSession(id){
    if(!window.confirm("Supprimer cette séance de l'historique ?")) return;
    await persist(Object.assign({},data,{sessions:sessions.filter(function(s){return s.id!==id;})}));
  }
  async function generateBilan(){
    if(!ANTHROPIC_KEY){showToast("⚠️ Renseigne ta clé API Claude d'abord");return;}
    var since=bilans.length?bilans[0].date:addDays(TODAY(),-7);

    finally{setGeneratingBilan(false);}

  var exerciseNames=allExerciseNames(data);
  var histExerciseNames=Array.from(new Set(sessions.reduce(function(a,s){return a.concat(s.exercises.map(function(e){return e.name;}));},[]))).sort();
  var effectiveHistEx=histExercise||(histExerciseNames[0]||"");

            return(
              <div key={ex.id} className="exercise-card">
                <div className="ex-header">
                  <span className="ex-name">{ex.name}</span>

              if(!val.startsWith("sk-ant-")){showToast("⚠️ Clé invalide");return;}
              ANTHROPIC_KEY=val;
              await persist(Object.assign({},data,{_apikey:val}));
              showToast("✅ Clé API sauvegardée");
            }}>Sauver</button>
          </div>
          {data._apikey&&<div style={{marginTop:8,fontSize:11,color:"var(--lime)",fontFamily:"var(--mono)"}}>✓ Clé configurée — {data._apikey.slice(0,14)}...</div>}
        </div>
        <div className="card" style={{marginBottom:14}}>
          <div className="card-title">Bilan de progression</div>
          <div style={{fontSize:12,color:"var(--muted)",marginBottom:12,lineHeight:1.6}}>L'IA analyse tes séances récentes et te dit, exercice par exercice, si tu progresses.</div>
          <button className="btn-main" disabled={generatingBilan} onClick={generateBilan}>
            {generatingBilan?<span><span className="spinner"/> Analyse…</span>:"🤖 Générer le bilan"}
          </button>
        </div>
        {bilans.map(function(b){return(
          <div key={b.id} className="coach-bubble">
            <div className="coach-tag">🤖 Bilan · {fmtShort(b.date)}</div>
            <div className="coach-text">{b.summary}</div>
            {b.per_exercise&&b.per_exercise.length>0&&<div style={{marginTop:10}}>
              {b.per_exercise.map(function(pe,i){return(
                <div key={i} className="trend-row">
                  <span className="trend-name">{pe.name}</span>
                  <span className={"chip "+(trendColor[pe.trend]||"blue")}>{pe.trend}</span>
                </div>
              );})}
            </div>}
            {b.advice&&<div style={{marginTop:10,padding:"8px 12px",background:"rgba(0,0,0,0.15)",borderRadius:8,fontSize:12}}>💡 {b.advice}</div>}
          </div>
        );})}
      </div>}

      {timerState&&<div className="timer-bar">
        <div className="timer-top">
          <span className="timer-label">⏱ Temps de repos</span>
          <span className={"timer-count"+(timerState.remaining===0?" done":timerState.remaining<=10?" warn":"")}>
            {timerState.remaining===0?"GO !":timerState.remaining+"s"}
          </span>
        </div>
        <div className="timer-progress">
          <div className="timer-progress-fill" style={{width:(timerState.remaining/timerState.total*100)+"%",background:timerState.remaining===0?"var(--lime)":timerState.remaining<=10?"var(--amber)":"var(--lime)"}}/>
        </div>
        <div className="timer-btns">
          {[120,180].map(function(s){return(
            <button key={s} className={"timer-preset"+(timerState.total===s?" active":"")} onClick={function(){startTimer(s);}}>
              {s/60}min
            </button>
          );})}
          <button className="timer-stop" onClick={stopTimer}>✕ Stop</button>
        </div>
      </div>}

      <nav className="bottom-nav">
        {[{id:"session",icon:"🏋️",label:"Séance"},{id:"program",icon:"📋",label:"Programme"},{id:"history",icon:"📊",label:"Historique"},{id:"bilan",icon:"🤖",label:"Bilan"}].map(function(n){return(
          <button key={n.id} className={"nav-btn"+(tab===n.id?" active":"")} onClick={function(){setTab(n.id);}}>
            <span className="nav-icon">{n.icon}</span>
            <span className="nav-label">{n.label}</span>
          </button>
        );})}
      </nav>
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/calorie-tracker/sw.js");
  });
}
</script>
</body>
</html>
